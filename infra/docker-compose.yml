services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelforge
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelforge"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel@postgres:5432/sentinelforge
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://sentinel:sentinel@postgres:5432/sentinelforge
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ../backend:/app
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO

  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ../frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api

  # Optional scanner containers (enable as needed):
  # zap:
  #   image: ghcr.io/zaproxy/zaproxy:stable
  #   command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.disablekey=true
  #   ports: ["8080:8080"]
  # openvas (Greenbone Community Edition) is a multi-container stack; see docs/setup.md.

volumes:
  pgdata:
